name: Build dist/sandstone.js
# hi
on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build:prod

      - name: Commit built dist/ back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "build: rebuild dist/ [skip ci]"
          git push
